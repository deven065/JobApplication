spring.application.name=JobApplication
spring.config.import=optional:file:./.env[.properties]
server.port=${PORT:8081}
coach.poll-ms=60000

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/proofpath}
spring.datasource.username=${DATABASE_USERNAME:proofpath}
spring.datasource.password=${DATABASE_PASSWORD:proofpath}
spring.datasource.hikari.maximum-pool-size=${DATABASE_POOL_SIZE:5}
spring.datasource.hikari.connection-timeout=10000
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update

github.token=${GITHUB_TOKEN:}
github.webhook.public-base-url=${GITHUB_WEBHOOK_PUBLIC_BASE_URL:}

coach.web.allowed-origin=${FRONTEND_ORIGIN:http://localhost:5173,http://127.0.0.1:5173}

coach.ai.provider=${AI_PROVIDER:auto}
groq.api-key=${GROQ_API_KEY:}
groq.model=${GROQ_MODEL:openai/gpt-oss-120b}

github.oauth.client-id=${GITHUB_OAUTH_CLIENT_ID:}
github.oauth.client-secret=${GITHUB_OAUTH_CLIENT_SECRET:}
app.base-url=${APP_BASE_URL:http://localhost:5173}

# Encrypts stored GitHub tokens. Use a long random value in production.
app.session-secret=${SESSION_SECRET:}
# Account emails (verification and password reset) through Resend. Leave the key empty to disable them.
email.resend-api-key=${RESEND_API_KEY:}
email.from=${EMAIL_FROM:ProofPath <onboarding@resend.dev>}
