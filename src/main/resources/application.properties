spring.application.name=JobApplication
# Optional local secrets file in the project root (gitignored), e.g. GROQ_API_KEY=gsk_...
# Works no matter how the backend is launched (IntelliJ, VS Code, mvnw).
spring.config.import=optional:file:./.env[.properties]
server.port=8081
server.error.include-stacktrace=never
coach.poll-ms=60000

# Local embedded database values. These work immediately with the included H2 dependency.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./proofpath-data;MODE=PostgreSQL;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update

# Do not put a real personal access token or webhook secret in this repository.
# PowerShell example: $env:GITHUB_TOKEN="github_pat_..."; .\mvnw.cmd spring-boot:run
github.token=${GITHUB_TOKEN:}
# Required only if the app should create a GitHub push webhook automatically.
# Set it to a public HTTPS tunnel/deployment base URL, without /api/webhooks/github.
github.webhook.public-base-url=${GITHUB_WEBHOOK_PUBLIC_BASE_URL:}

# React's dev server. Comma-separate trusted origins when necessary.
coach.web.allowed-origin=${FRONTEND_ORIGIN:http://localhost:5173,http://127.0.0.1:5173}

# AI review of job postings and repository evidence. Set ONE key; leave all unset to use keyword rules only.
# Free + fastest:  $env:GROQ_API_KEY="gsk_..."    (https://console.groq.com/keys)
# Free, larger limits: $env:GEMINI_API_KEY="AIza..." (https://aistudio.google.com/apikey)
# Paid, strongest: $env:ANTHROPIC_API_KEY="sk-ant-..."
# AI_PROVIDER=groq|gemini|claude forces a provider when several keys are set (default: auto).
coach.ai.provider=${AI_PROVIDER:auto}
groq.api-key=${GROQ_API_KEY:}
groq.model=${GROQ_MODEL:openai/gpt-oss-120b}
