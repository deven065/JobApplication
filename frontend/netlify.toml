# Netlify serves the React app. The Spring Boot API stays on Render, and Netlify forwards /api/* to it,
# so the browser only ever talks to the Netlify domain (same origin: the GitHub sign-in cookie just works).
# In Netlify set "Base directory" to `frontend` (this file lives there).
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# API calls are proxied (status 200 = rewrite, not a redirect). Change the target if your Render URL differs.
[[redirects]]
  from = "/api/*"
  to = "https://proofpath-8r5b.onrender.com/api/:splat"
  status = 200
  force = true

# Single-page app: /u/<login> and any other path serve the app shell.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
